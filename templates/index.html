<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events</title>
</head>
<body>
    <h1>Upcoming Events</h1>
    <ul>
        {% for event in events %}
            <li>
                <strong>{{ event.event }}</strong><br>
                {{ event.start_time }}<br>
                {{ event.description }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
